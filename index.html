<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ELIMU LENS OS</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>.hide{display:none!important}</style>
</head>
<body class="bg-[#f2f2f2]">

<!-- LOGIN -->
<div id="screen-login" class="min-h-screen flex items-center justify-center p-4">
<div class="bg-white w-full max-w-[380px] rounded-[28px] border shadow-sm p-7">
<div class="text-center">
<div class="w-16 h-16 bg-black rounded-[16px] flex items-center justify-center mx-auto text-[#DAA520] font-black text-2xl">E</div>
<div class="font-black tracking-[4px] mt-4 text-[20px]">ELIMU LENS</div>
<div class="text-[11px] text-gray-500 tracking-widest">SNAP A PHOTO. SCHOOL IS LIVE.</div>
</div>
<div class="mt-7">
<div class="text-[13px] font-bold">Phone Number</div>
<input id="phone" value="0718255742" class="w-full mt-2 bg-[#f0f4ff] border border-blue-100 rounded-full px-5 py-3.5 text-[15px] font-semibold">
<div class="text-[13px] font-bold mt-5">OTP Code (mock 1234)</div>
<input id="otp" value="1234" class="w-full mt-2 bg-gray-50 border rounded-full px-5 py-3.5 text-[15px] font-semibold">
<div id="err" class="hidden text-xs text-red-600 mt-3 bg-red-50 p-2 rounded-full text-center"></div>
<button id="loginBtn" class="w-full bg-black text-white rounded-full py-4 font-bold mt-6">Log In</button>
<div class="text-[11px] text-gray-500 text-center mt-3">Young Muslim Academy • Garissa • 450 pupils</div>
</div>
</div>
</div>

<!-- HUB LLCC STYLE -->
<div id="screen-hub" class="hide min-h-screen">
<div class="bg-white border-b p-3 sticky top-0">
<div class="max-w-[420px] mx-auto flex justify-between items-center">
<div class="flex gap-2 items-center"><div class="w-8 h-8 bg-black rounded-lg flex items-center justify-center text-[#DAA520] font-black">E</div><div class="font-black text-xs">ELIMU LENS V5.0</div></div>
<button onclick="location.reload()" class="text-xs bg-gray-100 px-3 py-1 rounded-full">Logout</button>
</div>
</div>
<div class="max-w-[420px] mx-auto p-4">
<div class="text-center mt-2"><div class="font-black text-[22px]">ELIMU LENS V5.0</div><div class="text-xs text-gray-600">Exact School Arrangement</div></div>
<div class="mt-6 space-y-3">
<button class="appBtn w-full bg-[#1e1e6b] text-white rounded-[16px] py-5 font-black" data-page="dashboard">FIELD - DASHBOARD</button>
<button class="appBtn w-full bg-[#2d3a9b] text-white rounded-[16px] py-5 font-black" data-page="bursar">BURSAR PAGE - VAULT</button>
<button class="appBtn w-full bg-[#0d8a7a] text-white rounded-[16px] py-5 font-black" data-page="admission">CENTRE - ADMISSION PAGE</button>
<button class="appBtn w-full bg-[#e67e00] text-white rounded-[16px] py-5 font-black" data-page="staff">STAFF PAGE</button>
<button class="appBtn w-full bg-[#1e1e6b] text-white rounded-[16px] py-4 font-bold text-sm" data-page="marks">MARKS PAGE</button>
<button class="appBtn w-full bg-[#2d3a9b] text-white rounded-[16px] py-4 font-bold text-sm" data-page="reports">REPORTS PAGE</button>
<button class="appBtn w-full bg-[#0d8a7a] text-white rounded-[16px] py-4 font-bold text-sm" data-page="attendance">ATTENDANCE PAGE</button>
<button class="appBtn w-full bg-[#e67e00] text-white rounded-[16px] py-4 font-bold text-sm" data-page="calendar">CALENDAR & SETTINGS</button>
</div>
</div>
</div>

<!-- APP INNER -->
<div id="screen-app" class="hide min-h-screen bg-[#f5f3ef]">
<div class="bg-black text-white p-3 flex justify-between items-center sticky top-0">
<button onclick="document.getElementById('screen-app').classList.add('hide');document.getElementById('screen-hub').classList.remove('hide')" class="bg-white/20 px-4 py-1.5 rounded-full text-xs">← Back</button>
<div id="appTitle" class="font-black text-xs text-[#DAA520]">BURSAR</div><div></div>
</div>
<div class="max-w-[800px] mx-auto p-3">
<div id="content" class="bg-white rounded-[18px] border p-5 text-sm">Loading...</div>
</div>
</div>

<script>
const loginBtn=document.getElementById('loginBtn');
loginBtn.addEventListener('click',function(){
 const otp=document.getElementById('otp').value.trim();
 const phone=document.getElementById('phone').value.trim();
 const err=document.getElementById('err');
 if(phone.length<5){err.innerText='Enter phone number';err.classList.remove('hidden');return;}
 if(otp!=='1234'){err.innerText='OTP must be 1234 (mock)';err.classList.remove('hidden');return;}
 // SUCCESS
 document.getElementById('screen-login').classList.add('hide');
 document.getElementById('screen-hub').classList.remove('hide');
});
document.querySelectorAll('.appBtn').forEach(b=>{
 b.addEventListener('click',()=>{
  const page=b.dataset.page;
  document.getElementById('screen-hub').classList.add('hide');
  document.getElementById('screen-app').classList.remove('hide');
  document.getElementById('appTitle').innerText=page.toUpperCase();
  let html='';
  if(page==='bursar'){html=`<div class="space-y-3"><div class="bg-black text-white rounded-xl p-4"><div class="text-[#DAA520] font-black">BURSAR - THE VAULT</div><div class="text-xs">Live money 2.61M • Day vs Boarding split • Archive only</div></div><div class="grid md:grid-cols-2 gap-3"><div class="border rounded-xl p-4 bg-[#fafaf7] text-center"><div class="font-bold">Snap Fees Book Photo</div><label class="mt-3 inline-block bg-black text-white px-5 py-2 rounded-full text-xs cursor-pointer">📷 Take Photo<input type="file" class="hidden"></label></div><div class="border rounded-xl p-4"><div class="font-bold">M-Pesa</div><textarea placeholder="Paste SMS" class="w-full border rounded-xl p-2 text-xs mt-2"></textarea></div></div><div class="border rounded-xl overflow-auto"><table class="w-full text-xs"><tr class="bg-gray-50"><th class="p-2 text-left">Pupil ADM Gender Stream Day/Boarding</th><th class="p-2">Balance</th></tr><tr><td class="p-2">Ahmed YMA001 M Class5 East Boarding</td><td class="p-2 text-red-600 font-bold">15k Debt</td></tr></table></div></div>`;}
  else if(page==='dashboard'){html=`<div class="grid grid-cols-2 gap-3"><div class="border rounded-xl p-4"><div class="text-xs">TOTAL PUPILS</div><div class="text-2xl font-black">450</div><div class="text-xs">Day 270 Boarding 180</div></div><div class="bg-black text-white rounded-xl p-4"><div class="text-[#DAA520] text-xs">VAULT</div><div class="text-2xl font-black">2.61M</div></div></div><div class="mt-4 border rounded-xl p-4"><div class="font-bold">Streams East/West/A/B Breakdown</div><div class="text-xs mt-2">Class 5 East 40 pupils Debt 80k</div></div>`;}
  else{html=`<div><div class="font-bold text-lg">${page.toUpperCase()} PAGE</div><div class="text-xs text-gray-500 mt-2">Organized UI - Photo + Gender M/F + Stream East/West/A/B + Day/Boarding + Archive Only + English Only. Ready to build full features here.</div><div class="mt-4 grid grid-cols-2 gap-2"><input placeholder="ADM" class="border rounded-full px-4 py-2 text-xs"><input placeholder="Name" class="border rounded-full px-4 py-2 text-xs"></div></div>`;}
  document.getElementById('content').innerHTML=html;
 });
});
</script>
</body>
</html>
